services:
  - type: web
    runtime: static
    name: autoblogger-client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      # SPA fallback: serve index.html for any path so refreshing a deep link works
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_BASE_URL
        sync: false # set the value in the Render dashboard
      - key: VITE_JWT_SECRET
        sync: false # set the value in the Render dashboard
